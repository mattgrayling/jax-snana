name: release

# Publishing a GitHub release builds the package and uploads it to PyPI, through
# PyPI trusted publishing from the pypi environment.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('jax_snlc_core/__init__.py').read()).group(1))")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
