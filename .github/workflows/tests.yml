name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  group:
    name: pytest (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + test deps
        run: pip install -e ".[test,redback]"

      # compiled programs are specific to the CPU they were compiled on
      - name: Identify the runner's CPU
        id: cpu
        run: |
          echo "id=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Restore the compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/jax_snana/compilation
          key: jax-${{ steps.cpu.outputs.id }}-g${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            jax-${{ steps.cpu.outputs.id }}-g${{ matrix.group }}-

      - name: Run pytest
        env:
          COVERAGE_FILE: coverage-${{ matrix.group }}
        run: |
          pytest tests/unit tests/integration tests/parity tests/smoke tests/perf \
            -n 2 --maxfail=5 --splits 6 --group ${{ matrix.group }} \
            --cov --cov-report=

      - name: Save the compilation cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/jax_snana/compilation
          key: jax-${{ steps.cpu.outputs.id }}-g${{ matrix.group }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: group-${{ matrix.group }}
          path: coverage-${{ matrix.group }}

  combine:
    name: pytest (Python 3.12)
    needs: group
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        run: test "${{ needs.group.result }}" = "success"

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: group-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          pip install coverage
          coverage combine coverage-*
          coverage report --fail-under=65
