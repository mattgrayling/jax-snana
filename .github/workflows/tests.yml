name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  group:
    name: pytest (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,redback]"

      # compiled programs are specific to the CPU they were compiled on
      - name: Identify the runner's CPU
        id: cpu
        run: |
          echo "id=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
          grep -m1 'model name' /proc/cpuinfo

      - name: Restore the compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/jax_snana/compilation
          key: jax-${{ steps.cpu.outputs.id }}-g${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            jax-${{ steps.cpu.outputs.id }}-g${{ matrix.group }}-

      - name: Run pytest
        run: |
          du -sh ~/.cache/jax_snana/compilation || true
          ( while true; do free -m | awk '/Mem:/{print $3}'; sleep 5; done ) > memory.log &
          pytest tests/unit tests/integration tests/parity tests/smoke tests/perf \
            -n 2 --splits 4 --group ${{ matrix.group }} \
            --store-durations --durations-path durations-${{ matrix.group }}.json \
            --durations=30 --cov --cov-report=
          echo "peak memory used: $(sort -n memory.log | tail -1) MB"
          echo "cache: $(du -sh ~/.cache/jax_snana/compilation | cut -f1), $(ls ~/.cache/jax_snana/compilation | wc -l) files"
          mv .coverage coverage-${{ matrix.group }}

      - name: Save the compilation cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci-experiment'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/jax_snana/compilation
          key: jax-${{ steps.cpu.outputs.id }}-g${{ matrix.group }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: group-${{ matrix.group }}
          path: |
            coverage-${{ matrix.group }}
            durations-${{ matrix.group }}.json
          include-hidden-files: true

  # the single required check: every group passed and coverage holds
  combine:
    name: pytest (Python 3.12)
    needs: group
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        run: test "${{ needs.group.result }}" = "success"

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: group-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          pip install coverage
          for f in coverage-*; do mv "$f" ".coverage.${f#coverage-}"; done
          coverage combine
          coverage report --fail-under=65
